<script>



    var webcamCaptureActive = false;
    var webcamRunning = false;
    const webcamElement = document.getElementById("webcam");
    var mediaRecorder;
    let chunks = [];
    var videoNumber;
    var  userId = "10";
    var zelfopname;

ophalenData(userId)

window.onload = function () {

function ophalenData(userId) {

//     $("#selectUsers").modal('hide');

//   userId = $("#selectUsersMenu").val();//FUCKING STRING IN PLAATS VAN INTEGER


//   thema = $("#selectThemaMenu").val();//FUCKING STRING IN PLAATS VAN INTEGER

var thema = "eten en drinken"



    var stopLoop = false

    fetch(`../fetch_all.php?limit=500&offset=0&thema=${thema}&handle=themaFilter`)
      .then(response => response.json())
      .then(data => {

        var i = 0;
        data.forEach(item => {
            i++;
          if(!stopLoop)
          {
          try {
          var videoTop = JSON.parse(item.videoTop);

          if (!Array.isArray(videoTop)) {
          videoTop = [];
          }
          // No need for else block to re-parse item.videoCenter
          } catch (error) {
          videoTop = []; // Ensure videoCenter is an array even in case of error
          }
          
          // Process each element in the 'data' array here
          //check if userid is in studopopnamewie
        //   console.log(userId)

            //now check if user already has made captures before in item.videoCenter
            console.log(userId)

             let useridExists = videoTop.some(item => item.userid === userId);

            if(!useridExists)
            {
              //tonen glos

                  $("#woordId").text(item.glos)
              //tonen zelfopname uit array
              //checken of het wel array is
            //   console.log("zelfopname")
              //first check if there is signbank opname TEMP
              if(item.zelfopname == "" || item.zelfopname == "[]")
              {
                zelfopname = item.glos+".mp4"
                // console.log(zelfopname +"van signbank")
              }
              else
              {
              
              try{
             zelfopname = JSON.parse(item.zelfopname);
              if(!Array.isArray(zelfopname))
              {
                // eslint-disable-next-line no-self-assign
                zelfopname = zelfopname;
              }
              else
              {
                if(zelfopname != "")
                {
                    // console.log(zelfopname)
                //pakt eerste zelfopname voorlopig: TODO: mogelijkheid om verschillende zelfopnaes te tonen
                zelfopname = zelfopname[0];
                }
                else{
                    zelfopname = item.glos+".mp4"
                }

              }
              }
              catch (error) {
                zelfopname = [""];
                //skip to next item
        //   stopLoop = false
            } 
          }
                  $("#videoContainer").hide();
            $("#officeVideoDiv").hide();
              $("#videoRow").show();

            //tonen zelfopname in videoelement
            var videoElement = document.getElementById('signbankVideo');

            // Set the new src attribute
            videoElement.src = "../uploads/"+zelfopname;

            // Load the new video source
            videoElement.load();

            // Play the video
            videoElement.play(); //tijdelijk

            //voor update array
          glos = item.id;
          stopLoop = true
          }



        
    
      }      

      })
     
      camerasReconnectStartupRunning = 0;

  }) .catch(error => {
        // Handle any errors that may occur during the fetch
        console.error('Error:', error);
      });}


      
      
document.addEventListener('keydown', function(event) {
  if (event.key === 'b') {
    webcamCaptureActive = !webcamCaptureActive;
    if (webcamCaptureActive) {
      startWebcamCapture(glos);
    } else {
        mediaRecorder.stop();
    }
  }
});

   // eslint-disable-next-line no-unused-vars
   function enableCam(event) {
    if (webcamRunning === true) {
      webcamRunning = false;
    } else {
      webcamRunning = true;
    }

    const constraints = {
      video: true
    };

      navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      webcamElement.srcObject = stream;

    });

  }

      






 function startWebcamCapture(glos) {


    $("#output_canvas").css("background-color", "red")
        $(".floating-div").show();       


const options = {
      audioBitsPerSecond: 128000,
      videoBitsPerSecond: 2500000,
      mimeType: "video/webm",
    };

   mediaRecorder = new MediaRecorder(webcamElement.srcObject, options );

    mediaRecorder.ondataavailable = function (event) {
        chunks.push(event.data);
      
    };

      mediaRecorder.onstop = function () {
      //send stop command to sony cameras
      const blob = new Blob(chunks, { type: "video/webm" });
    //   userId = $("#selectUsersMenu").val();//FUCKING STRING IN PLAATS VAN INTEGER

      videoNumber = videoNumber++;

      stopTime = new Date().toISOString();
      //prepare form array for fetch
      var formData = new FormData();
      formData.append("glos", glos);
      formData.append("startTime", startTime);
      formData.append("stopTime", stopTime);
      formData.append("videoNumber", videoNumber);
      formData.append("userid", userId); //TODO fix
      formData.append("video", blob);

        //convert formData to array
        var object = {};
formData.forEach((value, key) => object[key] = value);

// Stringify the object
var formDataJSON = JSON.stringify(object);
console.log(formDataJSON);

      fetch('../save_video_studio.php?formdata=' + formData, {
        method: 'POST',
        body: formData,
      }).then(response => response.json())
        .then(data => {
          console.log(data)
          if (data.success) {
            console.log(data)


          } else {
            console.log(data.error)
          }
        }).catch(function (error) {
          console.log(blob)
          console.log(glos)
          console.error('Error:', error);
        });
        startDisplayingWebcam(blob);

      chunks = [];
    };
  

    startTime = new Date().toISOString();
    console.log(startTime)
    //send capture command to sony cameras
    mediaRecorder.start();

}






function startDisplayingWebcam(blob) {
        console.log(blob);
        let myVideo1;
        let myVideo2;
        $("#videoContainer").show();
        $("#myVideo1").show();
        $("#myVideo2").show();
        $("#myVideo3").hide();

        myVideo1 = document.getElementById('myVideo1');
        myVideo1.style.width = '100%';
        myVideo1.style.position = 'fixed';  // Changed to 'fixed'
        myVideo1.style.left = '0';
        myVideo1.style.top = '0';



        myVideo1.src = URL.createObjectURL(blob); // Set the src attribute to the URL created from the blob
        myVideo1.load();
        myVideo1.addEventListener('loadedmetadata', function () {
          myVideo1.play();
        });
         myVideo2 = document.getElementById('myVideo2');
        myVideo2.style.width = '100%';
        myVideo2.src =  "../uploads/"+zelfopname; // Set the src attribute to the URL created from the blob
        myVideo2.load();
        myVideo2.addEventListener('loadedmetadata', function () {
          myVideo2.play();
        });
      }



</script>
